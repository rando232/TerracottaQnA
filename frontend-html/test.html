<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Terracotta QnA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>API Connection Test</h1>
    <button onclick="testAPI()">Test API Connection</button>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testSearch()">Test Search</button>
    
    <div id="results"></div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        const resultsDiv = document.getElementById('results');

        async function testAPI() {
            resultsDiv.innerHTML = '<p>Testing API connection...</p>';
            try {
                const response = await fetch(`${API_BASE_URL}/api/documents?limit=2`);
                const data = await response.json();
                resultsDiv.innerHTML = `
                    <div class="test-result success">
                        ✅ API Connection Success!<br>
                        Received ${data.length} documents
                    </div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ API Connection Failed: ${error.message}
                    </div>
                `;
            }
        }

        async function testLogin() {
            resultsDiv.innerHTML = '<p>Testing login...</p>';
            try {
                const formData = new URLSearchParams();
                formData.append('username', 'admin');
                formData.append('password', 'admin123');

                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultsDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ Login Success!<br>
                            User: ${data.user.username}<br>
                            Token: ${data.access_token.substring(0, 30)}...
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test-result error">
                            ❌ Login Failed: ${JSON.stringify(data)}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Login Error: ${error.message}
                    </div>
                `;
            }
        }

        async function testSearch() {
            resultsDiv.innerHTML = '<p>Testing search...</p>';
            try {
                const response = await fetch(`${API_BASE_URL}/api/search?query=BM25&top_k=3`);
                const data = await response.json();
                resultsDiv.innerHTML = `
                    <div class="test-result success">
                        ✅ Search Success!<br>
                        Found ${data.total_results} results<br>
                        Response time: ${data.response_time_ms}ms
                    </div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Search Failed: ${error.message}
                    </div>
                `;
            }
        }

        // Auto-test on load
        window.onload = testAPI;
    </script>
</body>
</html>
