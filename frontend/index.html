<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terracotta QnA - Information Retrieval Community</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        terracotta: {
                            50: '#fef6f3',
                            100: '#fde9e1',
                            200: '#fbd3c3',
                            300: '#f7b59a',
                            400: '#f18d66',
                            500: '#e8714a',
                            600: '#d4582f',
                            700: '#b24526',
                            800: '#933a23',
                            900: '#7a3322',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        /* Enhanced input styling */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            border-width: 2px !important;
            border-color: #d4582f !important;
            transition: all 0.2s ease;
        }
        
        input:focus,
        textarea:focus,
        select:focus {
            outline: none !important;
            border-color: #b24526 !important;
            box-shadow: 0 0 0 3px rgba(212, 88, 47, 0.2) !important;
        }
        
        .toast {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="bg-amber-50 text-slate-900">
    
    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>
    
    <!-- Header -->
    <header class="bg-orange-50 border-b-2 border-terracotta-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="/logo.png" alt="Terracotta QnA" class="w-10 h-10 rounded-xl shadow-sm" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-xl font-bold text-slate-900">Terracotta QnA</h1>
                    <p class="text-xs text-slate-600">Information Retrieval & Search Engineering</p>
                </div>
            </div>
            
            <nav class="flex items-center gap-2">
                <button onclick="showView('home')" class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-terracotta-100 transition-colors">
                    Home
                </button>
                <button id="auth-btn" onclick="showView('auth')" class="px-4 py-2 rounded-lg bg-terracotta-600 text-white text-sm font-semibold hover:bg-terracotta-700 transition-colors">
                    Login
                </button>
                <button id="profile-btn" onclick="showView('profile')" class="hidden px-4 py-2 rounded-lg text-sm font-medium hover:bg-terracotta-100 transition-colors">
                    Profile
                </button>
                <button id="logout-btn" onclick="logout()" class="hidden px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-100 text-red-600 transition-colors">
                    Logout
                </button>
            </nav>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Home View -->
        <div id="home-view" class="space-y-6">
            <!-- Search Bar -->
            <div class="bg-orange-50 rounded-2xl border-2 border-terracotta-200 p-6 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-4">Search Questions</h2>
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Search questions, topics, or keywords..."
                        class="flex-1 px-4 py-2 rounded-lg border-2 border-terracotta-600"
                        onkeypress="if(event.key === 'Enter') searchDocuments()"
                    >
                    <button onclick="searchDocuments()" class="px-6 py-2 rounded-lg bg-terracotta-600 text-white font-semibold hover:bg-terracotta-700 transition-colors">
                        Search
                    </button>
                </div>
                
                <!-- Filters -->
                <div class="mt-4 flex gap-3 items-center flex-wrap">
                    <select id="category-filter" onchange="searchDocuments()" class="px-3 py-1 rounded-lg border-2 border-terracotta-600 text-sm">
                        <option value="">All Categories</option>
                    </select>
                    <select id="sort-filter" onchange="searchDocuments()" class="px-3 py-1 rounded-lg border-2 border-terracotta-600 text-sm">
                        <option value="created_at">Latest</option>
                        <option value="views_count">Most Viewed</option>
                        <option value="vote_count">Highest Voted</option>
                    </select>
                </div>
            </div>
            
            <!-- Documents List -->
            <div id="documents-container" class="space-y-4">
                <!-- Documents will be loaded here -->
            </div>
            
            <!-- Create Question Button (for logged in users) -->
            <button id="create-btn" onclick="showCreateForm()" class="hidden fixed bottom-6 right-6 w-14 h-14 rounded-full bg-terracotta-600 text-white shadow-lg hover:bg-terracotta-700 transition-all hover:scale-110 flex items-center justify-center text-2xl">
                +
            </button>
        </div>
        
        <!-- Auth View -->
        <div id="auth-view" class="hidden max-w-md mx-auto">
            <div class="bg-orange-50 rounded-2xl border-2 border-terracotta-200 p-8 shadow-sm">
                <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Welcome to Terracotta QnA</h2>
                
                <!-- Login Form -->
                <div id="login-form">
                    <h3 class="text-lg font-semibold mb-4">Login</h3>
                    <form onsubmit="login(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Username or Email</label>
                            <input type="text" id="login-username" required class="w-full px-4 py-2 rounded-lg border-2 border-terracotta-600">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Password</label>
                            <input type="password" id="login-password" required class="w-full px-4 py-2 rounded-lg border-2 border-terracotta-600">
                        </div>
                        <button type="submit" class="w-full px-4 py-2 rounded-lg bg-terracotta-600 text-white font-semibold hover:bg-terracotta-700 transition-colors">
                            Login
                        </button>
                    </form>
                    <p class="mt-4 text-center text-sm text-slate-600">
                        Don't have an account? <button onclick="showRegisterForm()" class="text-terracotta-600 font-semibold hover:underline">Register</button>
                    </p>
                </div>
                
                <!-- Register Form -->
                <div id="register-form" class="hidden">
                    <h3 class="text-lg font-semibold mb-4">Create Account</h3>
                    <form onsubmit="register(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Username</label>
                            <input type="text" id="reg-username" required minlength="3" class="w-full px-4 py-2 rounded-lg border-2 border-terracotta-600">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Email</label>
                            <input type="email" id="reg-email" required class="w-full px-4 py-2 rounded-lg border-2 border-terracotta-600">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Full Name</label>
                            <input type="text" id="reg-name" required class="w-full px-4 py-2 rounded-lg border-2 border-terracotta-600">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Password</label>
                            <input type="password" id="reg-password" required minlength="6" class="w-full px-4 py-2 rounded-lg border-2 border-terracotta-600">
                        </div>
                        <button type="submit" class="w-full px-4 py-2 rounded-lg bg-terracotta-600 text-white font-semibold hover:bg-terracotta-700 transition-colors">
                            Register
                        </button>
                    </form>
                    <p class="mt-4 text-center text-sm text-slate-600">
                        Already have an account? <button onclick="showLoginForm()" class="text-terracotta-600 font-semibold hover:underline">Login</button>
                    </p>
                </div>
            </div>
        </div>
        
        <!-- Document Detail View -->
        <div id="detail-view" class="hidden space-y-6">
            <!-- Document content will be loaded here -->
        </div>
        
        <!-- Profile View -->
        <div id="profile-view" class="hidden max-w-2xl mx-auto">
            <div class="bg-orange-50 rounded-2xl border-2 border-terracotta-200 p-8 shadow-sm">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">My Profile</h2>
                <div id="profile-content">
                    <!-- Profile content will be loaded here -->
                </div>
            </div>
        </div>
        
    </main>
    
    <!-- App Script -->
    <script src="app.js"></script>
    
</body>
</html>
